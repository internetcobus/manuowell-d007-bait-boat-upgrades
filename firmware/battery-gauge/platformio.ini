; Battery gauge for the Manuowell D007: Waveshare ESP32-C3-Zero driving the
; hull's 4 LEDs (1 red + 3 blue) from the battery voltage. See
; docs/04-battery-led-indicator.md for the board layout and wiring.
;
; The devkitm-1 profile (4 MB) is the proven base for the C3-Zero (same as the
; camping fan). Native USB serial needs the two flags below.

[env:esp32-c3-zero]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
